<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{TITLE}}</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f3f4f6;
    font-family:Arial, Helvetica, sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" style="padding:40px 15px;">

            <!-- Main Card -->
            <table
                width="600"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="
                    max-width:600px;
                    width:100%;
                    background:#ffffff;
                    border-radius:18px;
                    overflow:hidden;
                "
            >

                <!-- Header -->
                <tr>
                    <td style="
                        padding:28px 35px;
                        border-bottom:1px solid #eeeeee;
                    ">

                        <table width="100%">
                            <tr>

                                <td>
                                    <div style="
                                        font-size:20px;
                                        font-weight:700;
                                        letter-spacing:-0.5px;
                                        color:#111111;
                                    ">
                                        Ahmet Kar
                                    </div>

                                    <div style="
                                        margin-top:4px;
                                        font-size:12px;
                                        color:#888888;
                                    ">
                                        BLOG
                                    </div>
                                </td>

                                <td align="right">
                                    <div style="
                                        font-size:12px;
                                        color:#999999;
                                    ">
                                        YENİ YAZI
                                    </div>
                                </td>

                            </tr>
                        </table>

                    </td>
                </tr>


                <!-- Hero -->
                <tr>
                    <td style="
                        padding:45px 35px 25px 35px;
                    ">

                        <div style="
                            font-size:12px;
                            font-weight:600;
                            letter-spacing:1.5px;
                            color:#777777;
                            text-transform:uppercase;
                        ">
                            Yeni İçerik
                        </div>

                        <h1 style="
                            margin:15px 0 0 0;
                            font-size:32px;
                            line-height:1.2;
                            letter-spacing:-1px;
                            color:#111111;
                        ">
                            {{TITLE}}
                        </h1>

                    </td>
                </tr>


                <!-- Divider -->
                <tr>
                    <td style="padding:0 35px;">

                        <div style="
                            height:1px;
                            background:#eeeeee;
                        "></div>

                    </td>
                </tr>


                <!-- Content -->
                <tr>
                    <td style="
                        padding:30px 35px;
                    ">

                        <div style="
                            font-size:16px;
                            line-height:1.8;
                            color:#555555;
                        ">
                            {{BODY}}
                        </div>

                    </td>
                </tr>


                <!-- CTA -->
                <tr>
                    <td style="
                        padding:5px 35px 40px 35px;
                    ">

                        <a
                            href="{{ARTICLE_URL}}"
                            style="
                                display:inline-block;
                                padding:14px 24px;
                                background:#111111;
                                color:#ffffff;
                                text-decoration:none;
                                font-size:14px;
                                font-weight:600;
                                border-radius:8px;
                            "
                        >
                            Yazıyı Oku →
                        </a>

                    </td>
                </tr>


                <!-- Footer -->
                <tr>
                    <td style="
                        padding:25px 35px;
                        background:#fafafa;
                        border-top:1px solid #eeeeee;
                    ">

                        <div style="
                            font-size:12px;
                            line-height:1.6;
                            color:#999999;
                        ">

                            Bu e-postayı, Ahmet Kar Blog'a abone olduğunuz
                            için alıyorsunuz.

                            <br><br>

                            © 2026 Ahmet Kar Blog

                            <br>

                            <a
                                href="{{UNSUBSCRIBE_URL}}"
                                style="
                                    color:#777777;
                                    text-decoration:underline;
                                "
                            >
                                Abonelikten çık
                            </a>

                        </div>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
