services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "sa@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1443:1433"
    volumes:
      - mssql_data:/var/opt/mssql
  memcached:
    image: memcached:1.6-alpine
    container_name: blog-memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    command:
      - memcached
      - -m
      - "256"
      - -c
      - "1024"
      - -v

volumes:
  mssql_data: